services:
  train:
    image: plant-disease-detector
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plant-disease-train
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./results:/workspace/results
      - ./src:/workspace/src
    command: python3 src/train.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference:
    image: plant-disease-detector
    container_name: plant-disease-inference
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./results:/workspace/results
      - ./src:/workspace/src
    command: python3 src/inference.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tensorboard:
    image: plant-disease-detector
    container_name: plant-disease-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./results:/workspace/results
    command: tensorboard --logdir=/workspace/results/logs --host=0.0.0.0
    restart: unless-stopped

  jupyter:
    image: plant-disease-detector
    container_name: plant-disease-jupyter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8888:8888"
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./results:/workspace/results
      - ./src:/workspace/src
      - ./notebooks:/workspace/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped